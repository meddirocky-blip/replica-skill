<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo AI Operating System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .settings-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 24px;
            cursor: pointer;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
        button.action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        /* API Vault Drawer */
        .vault-drawer {
            display: none;
            background: #111827;
            border: 1px solid #374151;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
        }
        .vault-field {
            display: flex;
            flex-direction: column;
        }
        .vault-field label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .vault-field input {
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
        }
        #consoleBox {
            background: #000;
            color: #4ade80;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            min-height: 120px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Solo AI Operating System</h2>
        <button class="settings-btn" onclick="toggleVault()">⋮</button>
    </div>

    <!-- Hidden API Vault Drawer -->
    <div id="vaultDrawer" class="vault-drawer">
        <h3>🔒 API Vault (Key Storage)</h3>
        <div class="vault-grid">
            <div class="vault-field">
                <label>OpenRouter API Key (Primary)</label>
                <input type="password" id="openrouterKey" placeholder="OpenRouter Key">
            </div>
            <div class="vault-field">
                <label>Gemini API Key</label>
                <input type="password" id="geminiKey" placeholder="AI Studio Key">
            </div>
            <div class="vault-field">
                <label>GitHub Access Token</label>
                <input type="password" id="githubToken" placeholder="GitHub Token">
            </div>
            <div class="vault-field">
                <label>Supabase Password / Key</label>
                <input type="password" id="supabaseKey" placeholder="Supabase Key">
            </div>
            <div class="vault-field">
                <label>Telegram Bot Token</label>
                <input type="password" id="telegramKey" placeholder="Bot Token">
            </div>
            <div class="vault-field">
                <label>Resend API Key</label>
                <input type="password" id="resendKey" placeholder="Email Key">
            </div>
            <div class="vault-field">
                <label>Apify API Key</label>
                <input type="password" id="apifyKey" placeholder="Scraper Key">
            </div>
            <div class="vault-field">
                <label>Hugging Face Token</label>
                <input type="password" id="hfKey" placeholder="HF Access Token">
            </div>
        </div>
        <button class="action-btn" style="margin-top:15px; background:#4ade80;" onclick="saveVault()">Save All Keys</button>
    </div>

    <!-- Command Workspace -->
    <div class="card">
        <label for="userPrompt"><b>AI Command Workspace:</b></label>
        <textarea id="userPrompt" placeholder="यहाँ अपना कमांड लिखें (जैसे: Create website layout)"></textarea>
        <button class="action-btn" onclick="runAITask()">Execute Task</button>
    </div>

    <!-- Output Box -->
    <div class="card">
        <label><b>System Console:</b></label>
        <div id="consoleBox">Solo AI OS ready...</div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const keys = ['geminiKey', 'openrouterKey', 'githubToken', 'supabaseKey', 'telegramKey', 'resendKey', 'apifyKey', 'hfKey'];
        keys.forEach(k => {
            if(localStorage.getItem(k)) {
                document.getElementById(k).value = localStorage.getItem(k);
            }
        });
    });

    function toggleVault() {
        const drawer = document.getElementById("vaultDrawer");
        drawer.style.display = drawer.style.display === "block" ? "none" : "block";
    }

    function saveVault() {
        const keys = ['geminiKey', 'openrouterKey', 'githubToken', 'supabaseKey', 'telegramKey', 'resendKey', 'apifyKey', 'hfKey'];
        keys.forEach(k => {
            localStorage.setItem(k, document.getElementById(k).value);
        });
        alert("API Vault updated successfully!");
        toggleVault();
    }

    async function runAITask() {
        const prompt = document.getElementById("userPrompt").value;
        const consoleBox = document.getElementById("consoleBox");
        const openrouterKey = localStorage.getItem("openrouterKey");

        if(!prompt) {
            alert("कृपया कोई कमांड दर्ज करें!");
            return;
        }

        if(!openrouterKey) {
            consoleBox.innerText = "Error: Please add your OpenRouter API Key in the Vault (⚙️) first!";
            return;
        }

        consoleBox.innerText = "Processing task with OpenRouter Engine (Llama 3.3)...";

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${openrouterKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "meta-llama/llama-3.3-70b-instruct",
                    "messages": [{"role": "user", "content": prompt}]
                })
            });

            const data = await response.json();
            if(data.choices && data.choices[0].message.content) {
                consoleBox.innerText = data.choices[0].message.content;
            } else {
                consoleBox.innerText = "Response Error: " + JSON.stringify(data);
            }
        } catch(err) {
            consoleBox.innerText = "Execution failed: " + err.message;
        }
    }
</script>

</body>
</html>
