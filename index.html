<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Jarvis Autonomous Seasonal OS - 3D Cyber Workspace</title>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&display=swap');

 :root {
 --bg-dark: #020617;
 --card-bg: rgba(15, 23, 42, 0.85);
 --neon-cyan: #06b6d4;
 --neon-pink: #ec4899;
 --neon-green: #10b981;
 --neon-amber: #f59e0b;
 --text-main: #f8fafc;
 --text-muted: #94a3b8;
 --border-glow: rgba(6, 182, 212, 0.4);
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Fira Code', monospace;
 }

 body {
 background-color: var(--bg-dark);
 color: var(--text-main);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 overflow-x: hidden;
 }

 header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 0.8rem 1.2rem;
 border-bottom: 1px solid var(--border-glow);
 background: rgba(2, 6, 23, 0.95);
 backdrop-filter: blur(12px);
 position: sticky;
 top: 0;
 z-index: 100;
 }

 .brand {
 font-family: 'Orbitron', sans-serif;
 font-size: 1rem;
 font-weight: 900;
 color: var(--neon-cyan);
 display: flex;
 align-items: center;
 gap: 0.5rem;
 }

 .hud-stats {
 display: flex;
 gap: 1rem;
 font-size: 0.75rem;
 align-items: center;
 }

 .hud-item span {
 color: var(--neon-cyan);
 font-weight: bold;
 }

 .weather-bar {
 display: flex;
 justify-content: space-between;
 align-items: center;
 background: #090d16;
 border-bottom: 1px solid var(--border-glow);
 padding: 0.5rem 1rem;
 font-size: 0.75rem;
 }

 .season-btn {
 background: rgba(30, 41, 59, 0.7);
 border: 1px solid var(--border-glow);
 color: var(--text-muted);
 padding: 0.3rem 0.7rem;
 border-radius: 6px;
 font-size: 0.7rem;
 cursor: pointer;
 transition: all 0.3s ease;
 }

 .season-btn.active, .season-btn:hover {
 background: var(--neon-cyan);
 color: var(--bg-dark);
 border-color: var(--neon-cyan);
 font-weight: bold;
 }

 .main-container {
 flex: 1;
 padding: 1rem;
 max-width: 1400px;
 margin: 0 auto;
 width: 100%;
 display: grid;
 grid-template-columns: 2fr 1fr;
 gap: 1rem;
 }

 @media (max-width: 900px) {
 .main-container {
 grid-template-columns: 1fr;
 }
 }

 .card {
 background: var(--card-bg);
 backdrop-filter: blur(12px);
 border: 1px solid var(--border-glow);
 border-radius: 12px;
 padding: 1.2rem;
 box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
 }

 .card-title {
 font-family: 'Orbitron', sans-serif;
 font-size: 0.85rem;
 color: var(--neon-cyan);
 margin-bottom: 0.8rem;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }

 #earthContainer {
 width: 100%;
 height: 380px;
 border-radius: 8px;
 position: relative;
 overflow: hidden;
 border: 1px solid var(--border-glow);
 background: radial-gradient(circle, #090d19 0%, #010409 100%);
 }

 input, select, textarea {
 background: rgba(2, 6, 23, 0.8);
 border: 1px solid var(--border-glow);
 color: var(--text-main);
 padding: 0.7rem;
 border-radius: 8px;
 font-size: 0.85rem;
 width: 100%;
 margin-bottom: 0.8rem;
 }

 button {
 background: linear-gradient(135deg, var(--neon-cyan), #2563eb);
 color: white;
 font-family: 'Orbitron', sans-serif;
 font-weight: 700;
 font-size: 0.75rem;
 padding: 0.6rem 1rem;
 border: none;
 border-radius: 8px;
 cursor: pointer;
 transition: all 0.2s;
 text-transform: uppercase;
 }

 button:hover {
 box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
 transform: translateY(-1px);
 }

 .console-box {
 background: #010409;
 border: 1px solid var(--border-glow);
 border-radius: 8px;
 padding: 0.8rem;
 font-size: 0.8rem;
 color: var(--neon-cyan);
 height: 200px;
 overflow-y: auto;
 white-space: pre-wrap;
 }

 /* Floating Copy Button Bar for Mobile */
 .floating-copy-bar {
 position: fixed;
 bottom: 20px;
 right: 20px;
 z-index: 999;
 }
 </style>
</head>
<body>

 <!-- Floating Quick Copy Button -->
 <div class="floating-copy-bar">
 <button onclick="copyMasterCode()" style="background: var(--neon-pink); box-shadow: 0 0 20px rgba(236,72,153,0.8); padding: 0.8rem 1.2rem; font-size: 0.85rem;">
 📋 Copy Full Code
 </button>
 </div>

 <header>
 <div class="brand">🤖 JARVIS SEASONAL OS</div>
 <div class="hud-stats">
 <div class="hud-item">Target: <span id="displayTarget" contenteditable="true" onblur="updateTarget(this)" style="border-bottom: 1px dashed var(--neon-cyan); cursor: pointer;">$5000</span></div>
 <button onclick="toggleDrawer()" style="padding: 0.3rem 0.6rem; font-size: 0.65rem;">⚙️ Code Drawer</button>
 </div>
 </header>

 <div class="weather-bar">
 <div><strong>SEASON:</strong> <span id="activeSeasonText" style="color: var(--neon-cyan);">❄️ WINTER SNOWFALL</span></div>
 <div style="display: flex; gap: 0.4rem;">
 <button class="season-btn active" onclick="setSeason('winter')">❄️ Winter</button>
 <button class="season-btn" onclick="setSeason('monsoon')">🌧️ Monsoon</button>
 <button class="season-btn" onclick="setSeason('summer')">☀️ Summer</button>
 </div>
 </div>

 <div class="main-container">
 <div>
 <div class="card" style="margin-bottom: 1rem;">
 <div class="card-title"><span>🌐 Interactive 3D Cyber Earth</span></div>
 <div id="earthContainer"></div>
 </div>
 <div class="card">
 <div class="card-title"><span>🎙️ Voice Commander</span></div>
 <div style="display: flex; gap: 0.5rem; margin-bottom: 0.8rem;">
 <input type="text" id="quickPrompt" placeholder="Ask Jarvis..." style="margin-bottom:0;">
 <button onclick="executeCommand()">Execute</button>
 </div>
 <div class="console-box" id="commandConsole">System Ready...</div>
 </div>
 </div>

 <div>
 <div class="card" style="margin-bottom: 1rem;">
 <div class="card-title"><span>🧮 Financial Math Desk</span></div>
 <label style="font-size: 0.75rem; color: var(--text-muted);">Monthly Outflow ($)</label>
 <input type="number" id="expensesInput" value="1200" oninput="calcFinance()">
 <div style="background: rgba(3,7,18,0.9); padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-glow); font-size: 0.8rem; margin-top: 0.5rem;">
 <div>Net Target: <span style="color: var(--neon-green); font-weight: bold;">$5,000.00</span></div>
 <div>Daily Profit Needed: <span id="dailyProfit" style="color: var(--neon-amber); font-weight: bold;">$206.00 / day</span></div>
 </div>
 </div>
 <div class="card">
 <div class="card-title"><span>🔐 API Vault</span></div>
 <input type="password" id="openrouterKey" placeholder="OpenRouter API Key">
 <button onclick="saveKey()" style="background: var(--neon-green); width: 100%;">Save Key</button>
 </div>
 </div>
 </div>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

 <script>
 // Universal Copy Function for Mobile
 function copyMasterCode() {
 const fullCode = document.documentElement.outerHTML;
 navigator.clipboard.writeText(fullCode).then(() => {
 alert('🎉 Full Master Code Copied Successfully! Now paste it anywhere (Email, WhatsApp, or GitHub).');
 }).catch(err => {
 alert('Failed to copy. Please select manually.');
 });
 }

 window.onload = function() {
 if(localStorage.getItem('openrouterKey')) {
 document.getElementById('openrouterKey').value = localStorage.getItem('openrouterKey');
 }
 calcFinance();
 };

 function saveKey() {
 localStorage.setItem('openrouterKey', document.getElementById('openrouterKey').value.trim());
 alert('Key Saved!');
 }

 function calcFinance() {
 const exp = parseFloat(document.getElementById('expensesInput').value) || 0;
 const daily = ((5000 + exp) / 30).toFixed(2);
 document.getElementById('dailyProfit').innerText = '$' + daily + ' / day';
 }

 // 3D Earth Workspace setup
 const container = document.getElementById('earthContainer');
 if(container) {
 const scene = new THREE.Scene();
 const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
 camera.position.z = 3.5;
 const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
 renderer.setSize(container.clientWidth, container.clientHeight);
 container.appendChild(renderer.domElement);
 const controls = new THREE.OrbitControls(camera, renderer.domElement);
 controls.autoRotate = true;
 scene.add(new THREE.AmbientLight(0xffffff, 1.2));
 const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshPhongMaterial({ color: 0x06b6d4, wireframe: true }));
 scene.add(earth);
 function animate() {
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene, camera);
 }
 animate();
 }
 </script>
</body>
</html>
