!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo AI OS Terminal - Cyberpunk Anime Edition</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNvbG8gQUkgT1MiLAogICJzaG9ydF9uYW1lIjogIlNvbG9BSSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDQwODFlIiwKICAidGhlbWVfY29sb3IiOiAiIzA0MDgxZSIKew==">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&display=swap');

    :root {
      --bg-dark: #04081e;
      --card-glass: rgba(13, 20, 48, 0.65);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d00ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-glow: rgba(0, 240, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fira Code', monospace;
    }

    /* Animated Cyber Grid Background */
    body {
      background: radial-gradient(circle at 50% 50%, #0d163a 0%, #04081e 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.2rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 200%; height: 200%;
      background: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: gridMove 20s linear infinite;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-30px, -30px); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--neon-cyan);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
      margin-bottom: 1.2rem;
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.2rem;
      flex: 1;
    }

    @media (min-width: 1024px) {
      .container {
        grid-template-columns: 360px 1fr;
      }
    }

    /* Glassmorphism Card */
    .card {
      background: var(--card-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.05);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.2);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input, select, textarea {
      background: rgba(4, 8, 30, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--text-main);
      padding: 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100%;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--neon-pink);
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
    }

    button {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .btn-success:hover {
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .console-box {
      background: rgba(2, 4, 15, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 0.85rem;
      color: #00f0ff;
      height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .preview-box {
      background: white;
      border-radius: 8px;
      height: 380px;
      width: 100%;
      border: 2px solid var(--neon-purple);
      box-shadow: 0 0 15px rgba(157, 0, 255, 0.3);
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .preset-btn {
      background: rgba(13, 20, 48, 0.8);
      border: 1px solid var(--border-glow);
      padding: 0.4rem 0.8rem;
      font-size: 0.7rem;
      width: auto;
      box-shadow: none;
    }

    .preset-btn:hover {
      background: var(--neon-cyan);
      color: var(--bg-dark);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚡ SOLO AI OS <span class="badge">CYBER-ANIME ENGINE</span>
    </div>
    <div style="font-size: 0.75rem; color: var(--neon-cyan); letter-spacing: 1px;">
      SYSTEM STATUS: ONLINE
    </div>
  </header>

  <div class="container">
    <!-- Left Panel: Vault & Config -->
    <div class="card">
      <div class="card-title">
        <span>🔐 API VAULT & ENGINE</span>
      </div>
     
      <label style="font-size: 0.7rem; color: var(--text-muted);">OPENROUTER KEY (PRIMARY ENGINE)</label>
      <input type="password" id="openrouterKey" placeholder="sk-or-v1-...">

      <label style="font-size: 0.7rem; color: var(--text-muted);">SECONDARY ENGINE (GEMINI / BACKUP)</label>
      <input type="password" id="geminiKey" placeholder="AIzaSy...">

      <label style="font-size: 0.7rem; color: var(--text-muted);">ACTIVE NEURAL MODEL</label>
      <select id="modelSelect">
        <option value="openrouter/free">OpenRouter Auto Free (Fastest)</option>
        <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (High Intelligence)</option>
        <option value="qwen/qwen-2.5-coder-32b-instruct:free">Qwen 2.5 Coder (Pure Code)</option>
        <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Reasoning Master)</option>
      </select>

      <button onclick="saveKeys()" class="btn-success">SAVE KEYS TO VAULT</button>

      <div class="card-title" style="margin-top: 1rem;">
        <span>🎭 AGENT PERSONA</span>
      </div>
      <select id="personaSelect">
        <option value="developer">🤖 Full-Stack Cyber Developer</option>
        <option value="freelancer">💼 Top-1% Upwork Pitch Master</option>
        <option value="growth">🚀 Growth Hacker & Strategist</option>
      </select>
    </div>

    <!-- Right Panel: Execution Workspace -->
    <div class="workspace" style="display: flex; flex-direction: column; gap: 1.2rem;">
      <div class="card">
        <div class="card-title">
          <span>⚡ COMMAND WORKSPACE</span>
        </div>

        <div class="presets">
          <button class="preset-btn" onclick="setPrompt('Create a clean, cyber-themed responsive HTML/CSS/JS Single Page Web App for: ')">🌐 Cyber Web App</button>
          <button class="preset-btn" onclick="setPrompt('Write a winning Upwork Proposal for this job post: ')">💼 Upwork Pitch</button>
          <button class="preset-btn" onclick="setPrompt('Debug and optimize this code snippet: ')">🛠️ Code Debugger</button>
        </div>

        <textarea id="userPrompt" placeholder="Enter system directive... (e.g., Create an interactive Cyberpunk Dashboard)"></textarea>

        <div style="display: flex; gap: 0.8rem;">
          <button onclick="executeTask()" style="flex: 2;">🚀 EXECUTE DIRECTIVE</button>
          <button onclick="clearConsole()" style="flex: 1; background: #334155; box-shadow: none;">CLEAR</button>
        </div>
      </div>

      <!-- System Console -->
      <div class="card">
        <div class="card-title">
          <span>📟 SYSTEM NEURAL CONSOLE</span>
        </div>
        <div id="consoleLog" class="console-box">Solo AI OS Cyberpunk Engine Loaded. Ready for input...</div>
      </div>

      <!-- Live Preview Drawer -->
      <div class="card">
        <div class="card-title">
          <span>🖥️ LIVE WEB PREVIEW SANDBOX</span>
          <button onclick="renderPreview()" style="width: auto; padding: 0.3rem 0.8rem; font-size: 0.65rem;">RENDER CODE</button>
        </div>
        <iframe id="previewFrame" class="preview-box"></iframe>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      if(localStorage.getItem('openrouterKey')) {
        document.getElementById('openrouterKey').value = localStorage.getItem('openrouterKey');
      }
      if(localStorage.getItem('geminiKey')) {
        document.getElementById('geminiKey').value = localStorage.getItem('geminiKey');
      }
    };

    function saveKeys() {
      const orKey = document.getElementById('openrouterKey').value.trim();
      const gemKey = document.getElementById('geminiKey').value.trim();
     
      localStorage.setItem('openrouterKey', orKey);
      localStorage.setItem('geminiKey', gemKey);
     
      alert('🔒 Vault Updated: Keys securely saved in browser LocalStorage!');
      logConsole('System Vault Synced. OpenRouter Engine Engaged.');
    }

    function setPrompt(prefix) {
      document.getElementById('userPrompt').value = prefix;
    }

    function logConsole(msg) {
      const c = document.getElementById('consoleLog');
      c.innerText += '\n\n' + msg;
      c.scrollTop = c.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('consoleLog').innerText = 'Console cleared.';
    }

    async function executeTask() {
      const apiKey = localStorage.getItem('openrouterKey') || document.getElementById('openrouterKey').value.trim();
      const prompt = document.getElementById('userPrompt').value.trim();
      const model = document.getElementById('modelSelect').value;
      const persona = document.getElementById('personaSelect').value;

      if(!apiKey) {
        alert('⚠️ OpenRouter Key Required! Please add it to the API Vault.');
        return;
      }

      if(!prompt) {
        alert('⚠️ Please enter a system directive!');
        return;
      }

      let systemPrompt = "You are an advanced Cyber AI OS Assistant.";
      if(persona === "developer") {
        systemPrompt = "You are a Master Full-Stack Web Developer. Output production-ready, beautiful HTML/CSS/JS code when asked for apps.";
      } else if(persona === "freelancer") {
        systemPrompt = "You are a Top-Rated Upwork Freelancer. Write highly compelling, concise, high-converting proposals.";
      }

      logConsole(`[TRANSMITTING TO OPENROUTER NEURAL NET - MODEL: ${model}]...\nProcessing directive...`);

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "Solo AI OS Cyber Engine"
          },
          body: JSON.stringify({
            "model": model,
            "messages": [
              {"role": "system", "content": systemPrompt},
              {"role": "user", "content": prompt}
            ]
          })
        });

        const data = await response.json();

        if(data.choices && data.choices[0]) {
          const aiResponse = data.choices[0].message.content;
          logConsole("--- [RESPONSE RECEIVED] ---\n" + aiResponse);

          if(aiResponse.includes("```html")) {
            const htmlCode = aiResponse.split("```html")[1].split("```")[0];
            document.getElementById('previewFrame').srcdoc = htmlCode;
            logConsole("✨ Code automatically compiled & rendered in Live Preview Sandbox!");
          } else if(aiResponse.includes("<!DOCTYPE html>") || aiResponse.includes("<html")) {
            document.getElementById('previewFrame').srcdoc = aiResponse;
            logConsole("✨ HTML Code rendered in Live Preview Sandbox!");
          }
        } else {
          logConsole("❌ API Error: " + JSON.stringify(data));
        }

      } catch (err) {
        logConsole("❌ Connection Failure: " + err.message);
      }
    }

    function renderPreview() {
      const text = document.getElementById('consoleLog').innerText;
      if(text.includes("```html")) {
        const code = text.split("```html")[1].split("```")[0];
        document.getElementById('previewFrame').srcdoc = code;
      } else {
        alert("No valid HTML code block found in console!");
      }
    }
  </script>
</body>
</html>
